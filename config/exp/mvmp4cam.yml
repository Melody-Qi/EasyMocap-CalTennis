height: -1
width: -1

dataset:
  log: False
  min_conf: 0.3
  filter:
    CritWithTorso:
      torso_idx: [1, 8, 2, 5, 9, 12]
      min_conf: 0.3
    CritMinJoints:
      min_joints: 12

# Ray (Plucker-line) affinity: links detections whose viewing rays meet.
# MAX_DIST in METERS. Good cross-camera pairs have ray miss ~0.05 m;
# degenerate same-side pairs diverge by meters -> rejected.
affinity:
  svt_py: True
  aff_funcs:
    "easymocap.affinity.ray.Affinity":
      MAX_DIST: 0.3
  svt_args:
    maxIter: 20
    w_sparse: 0.1
    w_rank: 50

associate:
  # each real player is seen by exactly 2 cameras (one W + one E)
  min_views: 2
  criterions:
    "easymocap.assignment.criterion.BaseCrit":
      min_conf: 0.1
      min_joints: 10
    # torso length 0.1-0.8 m REJECTS collapsed (0.07 m) degenerate matches
    "easymocap.assignment.criterion.CritLenTorso":
      src: 1
      dst: 8
      min_torso_length: 0.1
      max_torso_length: 0.8
      min_conf: 0.3
    "easymocap.assignment.criterion.CritMinMax":
      max_human_length: 2.5
      min_conf: 0.001
    # court world frame: x in [0,30], y in [-1,12], z (up) in [0,2.5]
    "easymocap.assignment.criterion.CritRange":
      minr: [-5, -15, -1]
      maxr: [35, 25, 3]
      rate_inlier: 0.8
      min_conf: 0.001
    "easymocap.assignment.criterion.CritWithTorso":
      torso_idx: [1, 8, 2, 5, 9, 12]
      min_conf: 0.3
    "easymocap.assignment.criterion.CritLimbLength":
      max_rate: 0.5
      body_type: "body25"
      min_conf: 0.1
